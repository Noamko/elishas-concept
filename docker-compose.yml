services:
  web:
    build: .
    container_name: elishas-concept-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx config is editable without rebuilding the image.
      # To enable HTTPS: copy nginx/ssl.conf.template -> nginx/ssl.conf (see certs/README.md),
      # put your certificate files in certs/, then: docker compose restart
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
