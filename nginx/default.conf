# HTTP server (port 80).
# Works as-is today. After you enable HTTPS (see nginx/ssl.conf.template),
# switch this block to redirect-only mode as explained below.

server {
    listen 80;
    listen [::]:80;
    # TODO: set your real domain
    server_name elishasconcept.co.il www.elishasconcept.co.il;

    include /etc/nginx/conf.d/site-common.inc;

    # --- After enabling HTTPS ---
    # 1. Comment out the "include" line above.
    # 2. Uncomment the two blocks below so HTTP only answers certificate
    #    renewal challenges and redirects everything else to HTTPS.
    #
    # location /.well-known/acme-challenge/ {
    #     root /usr/share/nginx/html;
    # }
    #
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}
